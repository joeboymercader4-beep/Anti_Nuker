<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aki Anti-Nuke | Live Security Monitor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
body { background-color: #0b0f19; color: #e2e8f0; }
.card-custom { background-color: #151c2c; border: 1px solid #1e293b; border-radius: 12px; }
.status-dot { display: inline-block; width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }
.status-dot.error { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }
.table-dark-custom { --bs-table-bg: #151c2c; --bs-table-border-color: #1e293b; color: #cbd5e1; }
</style>
</head>
<body class="py-4">
<div class="container my-3">
<div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary-subtle">
<div>
    <h2 class="fw-bold mb-0 text-white"><i class="bi bi-shield-check text-danger me-2"></i>Aki Anti-Nuke Dashboard</h2>
    <p class="text-secondary small mb-0">Clean Architecture Live Security Center</p>
</div>
<div class="d-flex align-items-center gap-2">
    <button class="btn btn-sm btn-outline-primary me-1" id="btnAddLog" type="button">
    <i class="bi bi-plus-circle me-1"></i> Add Test Log
    </button>
    <button class="btn btn-sm btn-outline-secondary me-2" id="btnRefresh" type="button">
    <i class="bi bi-arrow-clockwise me-1"></i> Refresh
    </button>
    <span class="status-dot" id="live-dot"></span>
    <span class="fw-bold text-success small" id="live-txt">LIVE</span>
</div>
</div>

<div class="row g-3 mb-4">
<div class="col-md-4">
    <div class="card card-custom p-3">
    <div class="d-flex align-items-center">
        <div class="fs-2 text-danger me-3"><i class="bi bi-exclamation-triangle"></i></div>
        <div>
        <div class="text-secondary small">Total Recorded Incidents</div>
        <div class="fs-3 fw-bold text-white" id="stat-total">0</div>
        </div>
    </div>
    </div>
</div>
<div class="col-md-4">
    <div class="card card-custom p-3">
    <div class="d-flex align-items-center">
        <div class="fs-2 text-success me-3"><i class="bi bi-cpu"></i></div>
        <div>
        <div class="text-secondary small">System Protection</div>
        <div class="fs-3 fw-bold text-success">ONLINE</div>
        </div>
    </div>
    </div>
</div>
<div class="col-md-4">
    <div class="card card-custom p-3">
    <div class="d-flex align-items-center">
        <div class="fs-2 text-info me-3"><i class="bi bi-database"></i></div>
        <div>
        <div class="text-secondary small">MySQL Database</div>
        <div class="fs-3 fw-bold text-info" id="db-status">CONNECTING...</div>
        </div>
    </div>
    </div>
</div>
</div>

<div class="card card-custom p-3">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="fw-bold mb-0 text-white"><i class="bi bi-list-ul me-2"></i>Security Logs</h5>
    <small class="text-secondary">Auto-refreshes every 2s</small>
</div>
<div class="table-responsive">
    <table class="table table-dark-custom align-middle mb-0">
    <thead>
        <tr>
        <th>ID</th>
        <th>Event Type</th>
        <th>Target</th>
        <th>Executor</th>
        <th>Action Taken</th>
        <th>Timestamp</th>
        </tr>
    </thead>
    <tbody id="logs-body">
        <tr><td colspan="6" class="text-center text-secondary py-4">Loading logs...</td></tr>
    </tbody>
    </table>
</div>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
const btnAddLog = document.getElementById('btnAddLog');
const btnRefresh = document.getElementById('btnRefresh');
let isFetching = false;

async function fetchLogs() {
if (isFetching) return;
isFetching = true;

try {
    const response = await fetch('/api/events');
    if (!response.ok) throw new Error('Database Error');
    const data = await response.json();

    document.getElementById('stat-total').innerText = data.length;
    const tbody = document.getElementById('logs-body');

    if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-secondary py-4">No security logs recorded yet.</td></tr>';
    } else {
    tbody.innerHTML = data.map(item => `
        <tr>
        <td><span class="text-secondary">#${item.id}</span></td>
        <td><span class="badge bg-primary">${item.event_type}</span></td>
        <td>${item.target_name}<br><small class="text-secondary">${item.target_id}</small></td>
        <td>${item.executor_name}<br><small class="text-secondary">${item.executor_id}</small></td>
        <td><span class="badge bg-danger">${item.action_taken}</span></td>
        <td><small class="text-secondary">${new Date(item.created_at).toLocaleString()}</small></td>
        </tr>
    `).join('');
    }

    document.getElementById('db-status').innerText = 'CONNECTED';
    document.getElementById('db-status').className = 'fs-3 fw-bold text-info';
    document.getElementById('live-dot').className = 'status-dot';
    document.getElementById('live-txt').innerText = 'LIVE';
    document.getElementById('live-txt').className = 'fw-bold text-success small';

} catch (err) {
    document.getElementById('db-status').innerText = 'ERROR';
    document.getElementById('db-status').className = 'fs-3 fw-bold text-danger';
    document.getElementById('live-dot').className = 'status-dot error';
    document.getElementById('live-txt').innerText = 'OFFLINE';
    document.getElementById('live-txt').className = 'fw-bold text-danger small';

    document.getElementById('logs-body').innerHTML = `
    <tr><td colspan="6" class="text-center text-danger py-4">
        Failed to fetch database logs. Make sure Express server & XAMPP MySQL are running.
    </td></tr>`;
} finally {
    isFetching = false;
}
}

btnAddLog.addEventListener('click', async function() {
btnAddLog.disabled = true;
btnAddLog.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Adding...';

try {
    const res = await fetch('/api/test-insert');
    if (res.ok) {
    await fetchLogs();
    } else {
    alert('API Route error.');
    }
} catch (e) {
    alert('Error connecting to server.');
} finally {
    btnAddLog.disabled = false;
    btnAddLog.innerHTML = '<i class="bi bi-plus-circle me-1"></i> Add Test Log';
}
});

btnRefresh.addEventListener('click', async function() {
btnRefresh.disabled = true;
btnRefresh.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Refreshing...';
await fetchLogs();
setTimeout(() => {
    btnRefresh.disabled = false;
    btnRefresh.innerHTML = '<i class="bi bi-arrow-clockwise me-1"></i> Refresh';
}, 300);
});

fetchLogs();
setInterval(fetchLogs, 2000);
});
</script>
</body>
</html>
